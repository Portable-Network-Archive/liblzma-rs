name: Build Webassembly
on: [push, pull_request]

jobs:
  test:
    name: Test WebAssembly
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta
          - nightly
        target:
          - wasm32-unknown-emscripten
          - wasm32-unknown-unknown
          - wasm32-wasip1
        include:
          - target: wasm32-unknown-emscripten
            container: emscripten/emsdk:latest
          - target: wasm32-unknown-unknown
            container: ghcr.io/portable-network-archive/wasi-sdk-gh-actions:wasi-sdk-22
          - target: wasm32-wasip1
            container: ghcr.io/portable-network-archive/wasi-sdk-gh-actions:wasi-sdk-22

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Use msrv lockfile
        run: |
          cp Cargo.lock.msrv Cargo.lock
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          toolchain: ${{ matrix.rust }}
      - if: ${{ startsWith(matrix.target, 'wasm32-wasi') }}
        name: Setup wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          github_token: ${{ github.token }}
      - if: ${{ startsWith(matrix.target, 'wasm32-wasi') }}
        name: Run test
        run: |
          cargo test --locked --target ${{ matrix.target }} --features wasm
      - if: ${{ endsWith(matrix.target, 'unknown') }}
        name: Run test
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --force wasm-bindgen-cli
          cargo test --locked --target ${{ matrix.target }} --features wasm --release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For ease GitHub API rate limits
      - name: Run test
        if: ${{ startsWith(matrix.target, 'wasm32-unknown-emscripten') }}
        run: |
          cargo test --locked --target ${{ matrix.target }} --features wasm -- --skip standard_files
        env:
          # emscripten 6.0.6 turned DEFAULT_TO_CXX off, so emcc no longer links
          # libc++abi/libunwind. rustc links via emcc, and std/panic_unwind need
          # them for __cpp_exception and _Unwind_*.
          RUSTFLAGS: "-C link-arg=-sINITIAL_MEMORY=128MB -C link-arg=-sDEFAULT_TO_CXX=1"
          # Doc-tests link through rustdoc, which does not read RUSTFLAGS.
          RUSTDOCFLAGS: "-C link-arg=-sDEFAULT_TO_CXX=1"
